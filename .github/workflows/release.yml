name: Release
run-name: Move ${{ inputs.major_tag }} to ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Full release tag to promote, such as v1.0.1
        required: true
        type: string
      major_tag:
        description: Floating major version tag
        required: true
        default: v1
        type: string

permissions:
  contents: write

concurrency:
  group: update-major-version-tag
  cancel-in-progress: false

jobs:
  update-major-version-tag:
    name: Update major version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MAJOR_VERSION_TAG: ${{ inputs.major_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move major version tag
        shell: bash
        run: |
          set -euo pipefail

          major_tag="$MAJOR_VERSION_TAG"
          if [[ ! "$major_tag" =~ ^v[1-9][0-9]*$ ]]; then
            echo "::error::MAJOR_VERSION_TAG must be a major version tag such as v1."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a full version tag such as v1.0.1."
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$major_tag".* ]]; then
            echo "::error::Release tag $RELEASE_TAG does not belong to $major_tag."
            exit 1
          fi

          target_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git tag --force "$major_tag" "$target_sha"
          git push --force origin "refs/tags/$major_tag:refs/tags/$major_tag"

          echo "Moved $major_tag to $RELEASE_TAG ($target_sha)."
