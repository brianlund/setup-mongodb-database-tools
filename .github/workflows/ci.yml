name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript
        run: npm run check

      - name: Run unit tests
        run: npm test

  integration:
    name: Integration (${{ matrix.runner }})
    needs: unit
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MongoDB Database Tools
        id: setup
        uses: ./
        with:
          version: "100.17.0"

      - name: Verify installed commands
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.setup.outputs.version }}
        run: |
          test "$INSTALLED_VERSION" = "100.17.0"
          mongodump --version
          mongorestore --version
          mongoexport --version
          mongoimport --version

      - name: Restore MongoDB Database Tools from cache
        id: setup-again
        uses: ./
        with:
          version: "100.17.0"

      - name: Verify cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup-again.outputs.cache-hit }}
        run: test "$CACHE_HIT" = "true"
